name: Release APK

# Pushing a v* tag builds the APK and creates the GitHub release with notes
# from git-cliff (cliff.toml) and the APK attached. A tag with a suffix
# (v1.2.3-rc.1) makes a pre-release. Re-running for an existing tag (manual
# run) rebuilds the APK and replaces it on the release.
#
# Optional signing secrets (if absent, a debug-signed APK is published instead).
# See docs/SIGNING.md.
#   SIGNING_KEYSTORE_BASE64  - keystore file encoded with `base64 -w0`
#   SIGNING_KEYSTORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to rebuild and attach the APK to'
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test and build APK
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            ./gradlew --no-daemon testDebugUnitTest assembleRelease
          else
            echo "::warning::Signing secrets not configured; publishing debug-signed APK."
            ./gradlew --no-daemon testDebugUnitTest assembleDebug
          fi

      - name: Sign and collect APK
        run: |
          mkdir -p dist
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            OUT="dist/OBDUSBtoTCPbridge-${TAG}.apk"
            BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
            UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --key-pass env:SIGNING_KEY_PASSWORD \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" verify "$OUT"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)" "dist/OBDUSBtoTCPbridge-${TAG}-debug.apk"
          fi
          ls -la dist

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*.apk
          fail_on_unmatched_files: true
