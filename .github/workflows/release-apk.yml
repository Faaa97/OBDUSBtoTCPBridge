name: Release APK

# Builds the APK when a tag is pushed or a GitHub release is published,
# and attaches it to the corresponding release (creating it if needed).
#
# Optional signing secrets (if absent, a debug-signed APK is published instead):
#   SIGNING_KEYSTORE_BASE64  - keystore file encoded with `base64 -w0`
#   SIGNING_KEYSTORE_PASSWORD
#   SIGNING_KEY_ALIAS
#   SIGNING_KEY_PASSWORD

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  # Manual run: builds the selected branch and creates the tag/release
  # at that commit if it doesn't exist yet.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach the APK to (created if missing)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.TAG }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            echo "::warning::Signing secrets not configured; publishing debug-signed APK."
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Sign and collect APK
        run: |
          mkdir -p dist
          OUT="dist/OBDUSBtoTCPbridge-${TAG}.apk"
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
            UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --key-pass env:SIGNING_KEY_PASSWORD \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" verify "$OUT"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)" "$OUT"
          fi
          ls -la dist

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          fail_on_unmatched_files: true
